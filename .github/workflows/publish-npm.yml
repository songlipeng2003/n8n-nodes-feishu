name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  # Manual runs build and validate only; they never publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      npm-tag: ${{ steps.release.outputs.npm_tag }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: node scripts/release-info.cjs

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test release guards
        run: pnpm test:release

      - name: Build and lint
        run: |
          pnpm build
          pnpm exec eslint -c .eslintrc.prepublish.js nodes credentials package.json

      - name: Pack the validated build
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Save the exact package to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish with npm trusted publishing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund

      - name: Download the validated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Publish the tarball with provenance
        env:
          NPM_DIST_TAG: ${{ needs.build.outputs.npm-tag }}
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP/npm-package/"*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one validated package tarball" >&2
            exit 1
          fi
          npm publish "${packages[0]}" --access public --provenance \
            --tag "$NPM_DIST_TAG" --registry=https://registry.npmjs.org/
